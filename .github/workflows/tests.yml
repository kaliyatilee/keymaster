name: tests

on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: keymaster_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: keymaster_test
      # CI uses root as the "migrator" so the grants test can create the
      # least-privilege runtime account. Production uses a dedicated account.
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_APP_USERNAME: keymaster_app
      DB_APP_PASSWORD: ci-app-password
      DB_APP_HOST: '%'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, mbstring
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: |
          if [ -f composer.lock ]; then
            composer install --no-interaction --prefer-dist --no-progress
          else
            composer update --no-interaction --prefer-dist --no-progress
          fi

      - name: Keep the resolved composer.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: composer.lock
          if-no-files-found: ignore

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Install JS dependencies and build (generates Wayfinder route helpers)
        id: build
        run: |
          npm ci
          npm run build

      - name: Code style (Pint)
        if: ${{ !cancelled() }}
        run: vendor/bin/pint --test -v

      - name: Static analysis (PHPStan)
        if: ${{ !cancelled() }}
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Frontend lint and format
        if: ${{ !cancelled() }}
        run: npm run check

      - name: TypeScript
        if: ${{ !cancelled() }}
        run: npm run types:check

      - name: Migrations run cleanly from scratch, roll back and re-run
        if: ${{ !cancelled() }}
        run: |
          php artisan migrate:fresh --force --seed
          php artisan migrate:rollback --force
          php artisan migrate --force --seed
          php artisan keymaster:db-grants

      - name: PHP tests
        if: ${{ !cancelled() }}
        run: php artisan test
